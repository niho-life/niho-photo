[workspace]
resolver = "2"
members = [
  "crates/niho-develop",
  "crates/niho-develop-wasm",
  "crates/niho-base-raw",
  "crates/niho-camera-color",
  "crates/niho-camera-profile",
  "crates/niho-quality-probe",
  "crates/niho-camera-linear-probe",
  "crates/niho-develop-render",
]

[workspace.package]
version = "0.26.0"
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.85"

[workspace.dependencies]
serde_json = "1"
libm = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Scaled IDCT for JPEGs much larger than the render (decode.rs); scalar code
# only, so native and wasm decode bit for bit alike.
jpeg-decoder = { version = "0.3.2", default-features = false, features = ["platform_independent"] }
quick-xml = "0.36"
moxcms = "0.8"
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
rawler = "=0.8.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Tests run image-sized loops; keep them fast without a release build.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 2
