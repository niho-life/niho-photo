[package]
name = "niho-develop-wasm"
description = "wasm-bindgen wrapper of niho-develop for the browser (Web Worker)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
niho-develop = { path = "../niho-develop" }
wasm-bindgen.workspace = true
js-sys.workspace = true
serde_json.workspace = true
# Research only (#130): wasm threads (rayon on Web Workers, shared memory).
wasm-bindgen-rayon = { version = "1", optional = true }

[features]
threads = ["dep:wasm-bindgen-rayon", "niho-develop/threads"]
