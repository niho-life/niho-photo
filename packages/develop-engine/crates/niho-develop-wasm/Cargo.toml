[package]
name = "niho-develop-wasm"
description = "wasm-bindgen wrapper of niho-develop for the browser (Web Worker)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
niho-develop = { path = "../niho-develop" }
wasm-bindgen.workspace = true
js-sys.workspace = true
serde_json.workspace = true
# `threads` (#151): the browser's threaded wasm (shared memory, rayon on Web
# Workers). `initThreadPool(n)` starts the pool; the pixels are the single
# thread's (`niho-develop/threads` splits rows and pixels only). Built by
# scripts/sdk/build-develop-engine-runtime.mjs with atomics and build-std; the
# default build (no feature) is the single-thread wasm.
wasm-bindgen-rayon = { version = "=1.3.0", optional = true }

[features]
threads = ["dep:wasm-bindgen-rayon", "niho-develop/threads"]
