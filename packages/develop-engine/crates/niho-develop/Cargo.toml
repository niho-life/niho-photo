[package]
name = "niho-develop"
description = "NIHO develop engine stage 2: Lightroom-style adjustments and XMP presets on linear ProPhoto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
niho-camera-color = { path = "../niho-camera-color" }
niho-camera-profile = { path = "../niho-camera-profile" }
serde_json = { workspace = true, features = ["raw_value"] }
libm.workspace = true
image.workspace = true
quick-xml.workspace = true
moxcms.workspace = true
jpeg-decoder.workspace = true
# Mask surfaces (`mask_surface.rs`, docs/local-adjustments.md "面の受け渡し"):
# the strict 8-bit gray PNG read/write (the png that image uses) and the
# sha256 of the PNG bytes that names a surface (the sha2 that
# niho-camera-profile uses). Neither adds a crate to Cargo.lock.
png = "0.18"
sha2 = "0.10"
# Research only (#130): data-parallel loops (each pixel computed as before).
rayon = { version = "1", optional = true }

[features]
threads = ["dep:rayon"]

[dev-dependencies]
wasm-bindgen-test = "=0.3.79"
