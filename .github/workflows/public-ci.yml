{
  "name": "Public CI",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "public-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "plan": {
      "name": "Change scope",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "outputs": {
        "matrix": "${{ steps.scope.outputs.matrix }}",
        "has-native": "${{ steps.scope.outputs.has-native }}",
        "has-swift": "${{ steps.scope.outputs.has-swift }}",
        "photo-editing": "${{ steps.scope.outputs.photo-editing }}",
        "photo-sdk": "${{ steps.scope.outputs.photo-sdk }}",
        "photo-candidate": "${{ steps.scope.outputs.photo-candidate }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.15.0"
          }
        },
        {
          "id": "scope",
          "run": "node scripts/ci/scopes.mjs"
        }
      ]
    },
    "publication": {
      "name": "Publication guard",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.15.0"
          }
        },
        {
          "run": "node --test scripts/ci/*.test.mjs"
        },
        {
          "id": "contract-source",
          "run": "node -e 'const value = JSON.parse(require(\"node:fs\").readFileSync(\"docs/security/cloud-contract-source.json\", \"utf8\")); if (!/^[a-f0-9]{40}$/.test(value.commit)) process.exit(1); process.stdout.write(\"commit=\" + value.commit + String.fromCharCode(10));' >> \"$GITHUB_OUTPUT\""
        },
        {
          "env": {
            "CONTRACT_SOURCE_SHA": "${{ steps.contract-source.outputs.commit }}"
          },
          "run": "set -euo pipefail\nsource_dir=\"$RUNNER_TEMP/niho-docs-contract\"\nif ! [[ \"$CONTRACT_SOURCE_SHA\" =~ ^[a-f0-9]{40}$ ]]; then exit 1; fi\ngit init --quiet \"$source_dir\"\ngit -C \"$source_dir\" -c credential.helper= fetch --quiet --no-tags --depth=1 https://github.com/niho-coliving/niho-docs.git \"$CONTRACT_SOURCE_SHA\"\ngit -C \"$source_dir\" checkout --quiet --detach FETCH_HEAD\nnode scripts/ci/cloud-contract-sync.mjs \"$source_dir\""
        },
        {
          "run": "npm run verify:publication"
        },
        {
          "run": "npm run format:check"
        },
        {
          "run": "git diff --check"
        }
      ]
    },
    "secrets": {
      "name": "Secret scan",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "run": "bash scripts/ci/scan-secrets.sh"
        }
      ]
    },
    "dependencies": {
      "name": "Dependency review",
      "if": "github.event_name == 'pull_request'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261",
          "with": {
            "fail-on-severity": "moderate",
            "fail-on-scopes": "runtime,development,unknown",
            "deny-licenses": "AGPL-1.0-only,AGPL-1.0-or-later,AGPL-3.0-only,AGPL-3.0-or-later",
            "allow-ghsas": "GHSA-wrw7-89jp-8q8g",
            "comment-summary-in-pr": "never",
            "retry-on-snapshot-warnings": true,
            "retry-on-snapshot-warnings-timeout": 120
          }
        }
      ]
    },
    "photo-editing": {
      "name": "Photo editing",
      "needs": [
        "plan",
        "publication"
      ],
      "if": "needs.plan.outputs.photo-editing == 'true'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "env": {
        "CI": "true"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.15.0"
          }
        },
        {
          "run": "npm ci --ignore-scripts --no-audit --no-fund"
        },
        {
          "run": "node scripts/ci/run-scope.mjs photo-editing"
        },
        {
          "run": "npm run sdk:test"
        }
      ]
    },
    "photo-sdk": {
      "name": "Photo SDK real build",
      "needs": [
        "plan",
        "publication"
      ],
      "if": "needs.plan.outputs.photo-sdk == 'true'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "env": {
        "CI": "true"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.15.0"
          }
        },
        {
          "run": "npm ci --ignore-scripts --no-audit --no-fund"
        },
        {
          "name": "固定Rust/WASM toolchainを準備",
          "run": "rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown\ncargo +1.98.1 install wasm-bindgen-cli --version 0.2.129 --locked"
        },
        {
          "name": "実WASM・pack・repo外consumerを検証",
          "env": {
            "SDK_RELEASE_DIR": "${{ runner.temp }}/photo-sdk-release",
            "SDK_RUNTIME_DIR": "${{ runner.temp }}/photo-sdk-runtime",
            "SDK_SOURCE_SHA": "${{ github.sha }}"
          },
          "run": "set -euo pipefail\nnpm run sdk:build-engine-runtime -- --output \"$SDK_RUNTIME_DIR\"\nnpm run sdk:pack -- --output \"$SDK_RELEASE_DIR\" --source \"$SDK_SOURCE_SHA\" --engine-assets \"$SDK_RUNTIME_DIR\"\nmanifest=\"$SDK_RELEASE_DIR/niho-photo-sdk-$(node -p 'require(\"./sdk/release-set.json\").version')-$SDK_SOURCE_SHA.json\"\nnpm run sdk:smoke -- --manifest \"$manifest\"\nnpm run sdk:smoke-real-engine -- --manifest \"$manifest\"\nnode scripts/sdk/verify-release-artifact.mjs --directory \"$SDK_RELEASE_DIR\" --expected-source \"$SDK_SOURCE_SHA\""
        }
      ]
    },
    "photo-candidate": {
      "name": "Photo Mac candidate proof",
      "needs": [
        "plan",
        "publication"
      ],
      "if": "needs.plan.outputs.photo-candidate == 'true'",
      "runs-on": "macos-26",
      "timeout-minutes": 90,
      "env": {
        "CI": "true"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.15.0"
          }
        },
        {
          "name": "lock済みNode依存をoverlay前に準備",
          "run": "npm ci --ignore-scripts --no-audit --no-fund"
        },
        {
          "name": "candidate data fixtureを検証",
          "run": "node --test scripts/candidate/*.test.mjs"
        },
        {
          "name": "固定Rust/WASM toolchainを準備",
          "run": "rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown\ncargo +1.98.1 install wasm-bindgen-cli --version 0.2.129 --locked"
        },
        {
          "name": "current SHAから完全Mac candidateを実build",
          "env": {
            "CANDIDATE_OUTPUT": "${{ runner.temp }}/photo-candidate",
            "CANDIDATE_RUN_ATTEMPT": "${{ github.run_attempt }}",
            "CANDIDATE_RUN_ID": "${{ github.run_id }}",
            "CANDIDATE_SOURCE_SHA": "${{ github.sha }}",
            "FIREBASE_CONFIG": "${{ runner.temp }}/photo-candidate-public-config.json",
            "SDK_RELEASE_DIR": "${{ runner.temp }}/photo-candidate-sdk",
            "SDK_RUNTIME_DIR": "${{ runner.temp }}/photo-candidate-runtime"
          },
          "run": "set -euo pipefail\nnpm run sdk:build-engine-runtime -- --output \"$SDK_RUNTIME_DIR\"\nnpm run sdk:pack -- --output \"$SDK_RELEASE_DIR\" --source \"$CANDIDATE_SOURCE_SHA\" --engine-assets \"$SDK_RUNTIME_DIR\"\nsdk_version=$(node -p 'require(\"./sdk/release-set.json\").version')\ncandidate_version=\"0.0.0\"\nsdk_manifest=\"$SDK_RELEASE_DIR/niho-photo-sdk-$sdk_version-$CANDIDATE_SOURCE_SHA.json\"\nsdk_manifest_sha=$(shasum -a 256 \"$sdk_manifest\" | cut -d ' ' -f 1)\nnode -e 'require(\"node:fs\").writeFileSync(process.argv[1], JSON.stringify({NIHO_PHOTO_PUBLIC_FIREBASE_WEB_API_KEY: \"AIza\" + \"0\".repeat(35)}) + \"\\n\")' \"$FIREBASE_CONFIG\"\nnpm run candidate:build -- --sdk-directory \"$SDK_RELEASE_DIR\" --sdk-mode local-validation --sdk-manifest-sha256 \"$sdk_manifest_sha\" --app-source \"$CANDIDATE_SOURCE_SHA\" --version \"$candidate_version\" --public-firebase-config \"$FIREBASE_CONFIG\" --node-modules \"$GITHUB_WORKSPACE/node_modules\" --output \"$CANDIDATE_OUTPUT\" --run-id \"$CANDIDATE_RUN_ID\" --run-attempt \"$CANDIDATE_RUN_ATTEMPT\"\ncandidate_manifest=$(find \"$CANDIDATE_OUTPUT\" -maxdepth 1 -type f -name '*.candidate.json')\nif [[ -z \"$candidate_manifest\" || \"$(find \"$CANDIDATE_OUTPUT\" -maxdepth 1 -type f -name '*.candidate.json' | wc -l | tr -d ' ')\" != \"1\" ]]; then exit 1; fi\ncandidate_manifest_sha=$(shasum -a 256 \"$candidate_manifest\" | cut -d ' ' -f 1)\nnpm run candidate:verify -- --directory \"$CANDIDATE_OUTPUT\" --expected-manifest-sha256 \"$candidate_manifest_sha\" --expected-source \"$CANDIDATE_SOURCE_SHA\" --expected-version \"$candidate_version\" --expected-sdk-mode local-validation --expected-sdk-version \"$sdk_version\" --expected-sdk-manifest-sha256 \"$sdk_manifest_sha\" --run-id \"$CANDIDATE_RUN_ID\" --run-attempt \"$CANDIDATE_RUN_ATTEMPT\""
        }
      ]
    },
    "native": {
      "name": "Client / ${{ matrix.scope }}",
      "needs": [
        "plan",
        "publication"
      ],
      "if": "needs.plan.outputs.has-native == 'true'",
      "runs-on": "macos-26",
      "timeout-minutes": 30,
      "strategy": {
        "fail-fast": false,
        "matrix": "${{ fromJSON(needs.plan.outputs.matrix) }}"
      },
      "env": {
        "CI": "true",
        "CSC_IDENTITY_AUTO_DISCOVERY": "false"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.15.0"
          }
        },
        {
          "run": "npm ci --ignore-scripts --no-audit --no-fund"
        },
        {
          "name": "公開native検証",
          "env": {
            "CI_SCOPE": "${{ matrix.scope }}"
          },
          "run": "node scripts/ci/run-scope.mjs \"$CI_SCOPE\""
        },
        {
          "name": "公開検証成果物・SBOM",
          "id": "release-evidence",
          "if": "matrix.scope == 'camera' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'niho-life/niho-photo'",
          "run": "rustup toolchain install 1.98.1 --profile minimal\nnode scripts/ci/release-evidence.mjs"
        },
        {
          "name": "公開検証成果物を保存",
          "id": "upload-release-evidence",
          "if": "matrix.scope == 'camera' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'niho-life/niho-photo'",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "${{ steps.release-evidence.outputs.name }}",
            "path": "dist/release-evidence/",
            "if-no-files-found": "error",
            "retention-days": 30,
            "compression-level": 0,
            "include-hidden-files": false
          }
        },
        {
          "name": "公開検証成果物の輸送receiptを記録",
          "id": "release-artifact-receipt",
          "if": "matrix.scope == 'camera' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'niho-life/niho-photo'",
          "env": {
            "RELEASE_ARTIFACT_ID": "${{ steps.upload-release-evidence.outputs.artifact-id }}",
            "RELEASE_ARTIFACT_DIGEST": "${{ steps.upload-release-evidence.outputs.artifact-digest }}",
            "RELEASE_ARTIFACT_NAME": "${{ steps.release-evidence.outputs.name }}"
          },
          "run": "node scripts/ci/write-artifact-receipt.mjs"
        }
      ]
    },
    "swift": {
      "name": "Develop engine Swift",
      "needs": [
        "plan",
        "publication"
      ],
      "if": "needs.plan.outputs.has-swift == 'true'",
      "runs-on": "macos-26",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "run": "swift --version"
        },
        {
          "run": "swift test --package-path packages/develop-engine/tools/apple-raw-linear"
        },
        {
          "run": "swift test --package-path packages/develop-engine/tools/niho-camera-cutout"
        },
        {
          "name": "niho-camera-cutout の Vision E2E（合成画像）",
          "env": {
            "NIHO_CUTOUT_E2E": "1"
          },
          "run": "swift test --package-path packages/develop-engine/tools/niho-camera-cutout --filter VisionEndToEndTests"
        }
      ]
    },
    "aggregate": {
      "name": "Public CI required",
      "if": "always()",
      "needs": [
        "plan",
        "publication",
        "secrets",
        "dependencies",
        "photo-editing",
        "photo-sdk",
        "photo-candidate",
        "native",
        "swift"
      ],
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.15.0"
          }
        },
        {
          "env": {
            "CI_NEEDS": "${{ toJSON(needs) }}"
          },
          "run": "node scripts/ci/aggregate.mjs"
        }
      ]
    }
  }
}
