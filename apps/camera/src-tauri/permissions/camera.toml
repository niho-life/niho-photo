[[permission]]
identifier = "allow-camera-app-info"
description = "Allows the bundled NIHO photo UI to read the app's own version (for the about line and support). No input is accepted."
commands.allow = ["camera_app_info"]

[[permission]]
identifier = "allow-camera-library"
description = "Allows the bundled NIHO photo UI to add a folder or photos chosen with native pickers, list them again, read selected-photo references without rescanning folders, list remembered sources that exist now (missing ones are skipped, not forgotten), and remove remembered folder or selected-photo references without touching original photos, edits, or other source registrations (thumbnails come from the niho-thumb URI scheme, not a command). Hidden files, packages and symlinks below folders are skipped; selected symlinks are canonicalized. Folder and photo paths never leave the app; the page only sees opaque folder and entry IDs and safe metadata. Listed photos also carry their pick / reject flag, which the UI can set or clear by entry ID; flags are kept on this Mac (Application Support/life.niho.camera/photo-editing/flags.json) keyed by a SHA-256 of each photo's name, size and modified time, with no names or paths stored."
commands.allow = ["camera_library_add_folder", "camera_library_add_photos", "camera_library_remembered", "camera_library_selected_photos", "camera_library_list_folder", "camera_library_forget_folder", "camera_library_forget_photos", "camera_library_set_flags", "camera_photo_interactive_preview", "camera_photo_cancel_interactive_preview"]

[[permission]]
identifier = "allow-camera-photos"
description = "Allows the bundled NIHO photo UI to open listed photos (reading their content SHA-256), close them, read an open photo's metadata for the info panel (camera, lens, exposure, capture date, dimensions and GPS position read with ImageIO; nothing is cached or written), save each photo's develop settings on this Mac with a revision check (Application Support/life.niho.camera/edits/<SHA-256>.json), save, read back and look up immutable mask surfaces for brush / subject / sky masks (8-bit grayscale PNGs up to 8 MiB, named by SHA-256, up to 64 per photo; Application Support/life.niho.camera/mask-surfaces/<photo SHA-256>/<surface SHA-256>.png), and read or replace named and automatic develop versions with their own revision check in a separate file (edits/<SHA-256>.versions.json; names, dates and develop settings only). No path is accepted or returned. Originals are never modified."
commands.allow = ["camera_photo_open", "camera_photo_close", "camera_photo_info", "camera_photo_save_settings", "camera_mask_surface_save", "camera_mask_surface_load", "camera_mask_surface_exists", "camera_photo_versions", "camera_photo_save_versions"]

[[permission]]
identifier = "allow-camera-develop"
description = "Allows the bundled NIHO photo UI to check the bundled apple-raw-linear / niho-develop-render sidecars, develop an open photo (a working copy cached in the app cache, handed over once per token) and export it at full size as JPEG through the native save dialog or into a folder chosen with the native folder picker (never overwriting, never the original). Only the capture date is written into exported JPEGs."
commands.allow = ["camera_develop_status", "camera_develop_source", "camera_develop_source_bytes", "camera_export", "camera_choose_export_folder", "camera_export_to_folder"]

[[permission]]
identifier = "allow-camera-cutout"
description = "Allows only the bundled NIHO photo UI to use the verified open photo ID for the bundled niho-camera-cutout sidecar: probe it, load/save that photo's SHA-256-bound recipe, detect/cancel, read only masks belonging to that photo, export through the native save dialog, and detect the subject mask surface of that photo's working image (a RAW working copy is drawn to sRGB with the bundled niho-develop-render first) into its mask surface store. No path is accepted or returned."
commands.allow = ["camera_cutout_status", "camera_cutout_load_recipe", "camera_cutout_save_recipe", "camera_cutout_detect", "camera_cutout_cancel", "camera_cutout_read_mask", "camera_cutout_export", "camera_mask_surface_detect"]

[[permission]]
identifier = "allow-camera-presets"
description = "Allows the bundled NIHO photo UI to list, create (from an imported Lightroom XMP or the current develop settings written as XMP), rename and delete the presets kept on this Mac (Application Support/life.niho.camera/presets/). The page passes the XMP text; no path is accepted. Writing an XMP file goes through allow-camera-save."
commands.allow = ["camera_presets_list", "camera_presets_create", "camera_presets_rename", "camera_presets_delete"]

[[permission]]
identifier = "allow-camera-photo-bench-notice"
description = "Allows the bundled NIHO photo UI to learn whether the former NIHO camera (Photo Bench) left saved edits on this Mac, to show a one-line notice that they are not carried over. Only a yes/no is returned; no file is read or passed."
commands.allow = ["camera_photo_bench_edits"]

[[permission]]
identifier = "allow-camera-save"
description = "Allows the bundled NIHO photo UI to save a file it rendered (JPEG, PNG or XMP, at most 256 MiB, sent as raw bytes with a plain file name and no path) to a place chosen with the native save dialog, and to copy an open photo's original file to a place chosen with the native save dialog. Never writes over an open photo's original; replacing another existing file is left to the save dialog's confirmation. Only the saved file name is returned."
commands.allow = ["camera_save_file", "camera_export_original"]

[[permission]]
identifier = "allow-camera-updates"
description = "Allows the bundled NIHO photo UI to read whether the startup update check downloaded a newer signed version (it applies on the next launch). The check runs natively at startup; the page cannot check, install or restart."
commands.allow = ["camera_update_status"]

[[permission]]
identifier = "allow-camera-account"
description = "同梱のmain画面に固定分類のアカウント状態と操作だけを許可する。URL、token、プロフィール、権限claimは受け渡さない。"
commands.allow = ["camera_account_state", "camera_account_login", "camera_account_cancel", "camera_account_logout", "camera_account_refresh"]

[[permission]]
identifier = "allow-camera-photo-session"
description = "同梱のmain画面だけに、既存Camera認証で照合した本人写真セッションの安全な表示用metadataを読むことを許可する。入力、token、任意URL、path、権限の証明は受け渡さない。"
commands.allow = ["camera_photo_identity"]

[[permission]]
identifier = "allow-camera-photo-cloud"
description = "同梱のmain画面だけに、native認証に束縛した固定本人写真操作と、検証済み一時原本handleの最大1MiB読取・取消・解放と、本人fence内で確定する原本保存を許可する。URL、header、token、path、upload ticketは受け渡さない。"
commands.allow = ["camera_photo_request", "camera_photo_content_open", "camera_photo_content_read", "camera_photo_content_close", "camera_photo_content_cancel", "camera_photo_original_save"]

[[permission]]
identifier = "allow-camera-photo-copy"
description = "同梱main画面だけに、native認証へ束縛した本人の明示copyの再開・開始・状態確認・取消と、SHA-256・PNG形状を照合したmaskの保存を許可する。opaque ID・mask PNGだけを渡し、原本・path・token・ticket・URL・headerはnative内に保つ。明示copyは原本・全参照mask・完全補正の照合前に完了を返さない。"
commands.allow = ["camera_photo_copy_recover", "camera_photo_copy_start", "camera_photo_copy_status", "camera_photo_copy_cancel", "camera_photo_mask_upload"]

[[permission]]
identifier = "allow-camera-hosted-folders"
description = "Allows the bundled NIHO photo UI (main window) to register folders for the hosted Mac connector with the native folder picker, list them by opaque ID, name and availability, remove a registration (folders and photos are never touched), and read whether the connector's launchd agent is registered. Registering the first folder registers the bundled LaunchAgent and starts the hidden connector window; removing the last one unregisters it and stops the window. No path is accepted or returned."
commands.allow = ["camera_hosted_folders_list", "camera_hosted_folders_add", "camera_hosted_folders_remove", "camera_hosted_agent_status"]

[[permission]]
identifier = "allow-camera-hosted-connector"
description = "Allows only the hidden hosted Mac connector window to list, stat, open and read regular files below registered folders read-only by opaque root ID and relative path (no symlinks, no '..', nothing outside the registered folder, no writes, no commands), hash a file natively with its identity checked before and after, keep the local index and scan checkpoint in private per-library Application Support files, read and replace its vault (one JSON item in the Keychain, at most 64 KiB), hold and release an idle-sleep assertion while it works, and answer the sleep notice. No absolute path is accepted or returned to the main window."
commands.allow = ["camera_hosted_connector_roots", "camera_hosted_connector_index_store", "camera_hosted_connector_root_status", "camera_hosted_connector_list", "camera_hosted_connector_stat", "camera_hosted_connector_open", "camera_hosted_connector_read", "camera_hosted_connector_close", "camera_hosted_connector_hash", "camera_hosted_connector_vault_read", "camera_hosted_connector_vault_write", "camera_hosted_connector_power_hold", "camera_hosted_connector_power_release", "camera_hosted_connector_sleep_ready"]

[[permission]]
identifier = "allow-camera-photo-sharing"
description = "同梱のmain画面だけに、共有アルバム（/cloud/sharing/v1）の通信を許可する。画面は route の表で作った path・query・body・冪等 key だけを渡し、native が固定の origin と build 設定の上流 prefix・native 認証を付ける（BFF だけの保留の招待の経路は送らない）。upload の ticket は native に留め、画面へは代わりの handle を返す。完成写真の bytes（raw IPC、200MiB まで）を native が ticket の先へ送り、完成写真・thumbnail は SHA-256 と長さを確かめてから 1MiB ずつ返す。token・URL・path は受け渡さない。"
commands.allow = ["camera_sharing_status", "camera_sharing_request", "camera_sharing_upload", "camera_sharing_content_open", "camera_sharing_content_read", "camera_sharing_content_close"]
